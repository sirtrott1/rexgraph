# Development build environment. `make install-dev` installs the package extras.
# `micromamba create -p .venv -f environment.yml`
# `make install-dev`
name: rexgraph
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - numpy>=2.0
  - meson>=1.3
  - meson-python>=0.18
  - cython>=3.0
  - ninja
  - pkg-config
  - c-compiler
  - openblas
  - pytest>=7.0
