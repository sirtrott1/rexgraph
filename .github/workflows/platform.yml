name: installed platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
          python -m pip install build
      - name: build all five wheels
        run: |
          for package in . rcql rcdb system agent; do
            python -m build --wheel --outdir dist "$package"
          done
      - name: install into a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/platform"
          "$RUNNER_TEMP/platform/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/platform/bin/python" -m pip install --find-links dist \
            'rexgraph[io,security,oracles]' 'rexgraph-rcdb[sql,objectstore,crypto]' \
            'rexgraph-agent[dev,molecules]' 'rexgraph-system[dev]' pytest trove-classifiers sympy
      - name: install native query and storage without SciPy
        run: |
          python -m venv "$RUNNER_TEMP/native"
          "$RUNNER_TEMP/native/bin/python" -m pip install --find-links dist dist/rexgraph-*.whl dist/rexgraph_rcql-*.whl dist/rexgraph_rcdb-*.whl
          "$RUNNER_TEMP/native/bin/python" -m pip install --find-links dist 'rexgraph[io,security]' 'rexgraph-rcdb[sql,objectstore,crypto]' pytest
          "$RUNNER_TEMP/native/bin/python" -m pip check
      - name: native installation and lifecycle acceptance
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/native/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_no_scipy.py" --platform --operators --require-absent
          "$RUNNER_TEMP/native/bin/python" -I "$GITHUB_WORKSPACE/scripts/experiment_rcql_rcdb.py" \
            --output "$RUNNER_TEMP/native-lifecycle" --code-revision "$GITHUB_SHA"
      - name: prose checks
        run: python scripts/check_writing.py
      - name: installed suites
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/platform/bin/python" -I "$GITHUB_WORKSPACE/scripts/test_installed.py" \
            --package rexgraph --package rcql --package rcdb --package system --package agent -- \
            "$GITHUB_WORKSPACE/rexgraph/tests" "$GITHUB_WORKSPACE/rcql/tests" \
            "$GITHUB_WORKSPACE/rcdb/tests" "$GITHUB_WORKSPACE/system/tests" \
            "$GITHUB_WORKSPACE/agent/tests" -q --tb=short -rs
      - name: native runtime and dependencies
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/platform/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_no_scipy.py" --platform --operators
          "$RUNNER_TEMP/platform/bin/python" -m pip check
      - name: RCQL and RCDB lifecycle experiment
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/platform/bin/python" -I "$GITHUB_WORKSPACE/scripts/experiment_rcql_rcdb.py" \
            --output "$RUNNER_TEMP/lifecycle" --code-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-evidence
          path: |
            dist/*.whl
            ${{ runner.temp }}/lifecycle
            ${{ runner.temp }}/native-lifecycle
