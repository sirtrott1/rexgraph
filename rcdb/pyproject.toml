[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rexgraph-rcdb"
version = "1.1.4"
description = "RCDB: a database of relational complexes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# safetensors is BASE, not an extra: every backend's put goes through
# serialize_complex, which writes safetensors bytes, and index.py reads and writes the
# tensor index with it. Without it a store imports fine and fails on its first put, which
# is the worst place to learn about a missing dependency.
dependencies = ["rexgraph>=1.1.4", "numpy>=1.24", "safetensors>=0.3", "scipy>=1.10"]

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0"]
objectstore = ["fsspec>=2023.1"]
crypto = ["cryptography>=42"]
dev = ["pytest>=7.0", "rexgraph-rcdb[sql,objectstore,crypto]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rcdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The same rules the rest of the repository is held to.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length: enforced by review, not by the linter
    "E701",   # `if x: return` and paired statements on one line, used throughout
    "E702",   # `a.append(x); b.append(y)`, the same compact style
]
