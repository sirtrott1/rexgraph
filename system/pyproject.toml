[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rexgraph-system"
version = "1.1.3"
description = "RexGraph System: the observatory, reading live values through RCQL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "rexgraph>=1.1.3",
    "rexgraph-rcql>=1.1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# The RCDB panels reach a store through a registered source, never by importing one.
# This names where such a store comes from, for a caller that wants one.
[project.optional-dependencies]
rcdb = ["rexgraph-rcdb>=1.1.3"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
rexgraph-system = "system.server.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["system*"]

[tool.setuptools.package-data]
"system" = ["../frontend/*.html", "../frontend/*.jsx", "../frontend/styles/*.css",
            "../frontend/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The same rules the rest of the repository is held to, so a new distribution does not
# quietly get its own standard.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length: enforced by review, not by the linter
    "E701",   # `if x: return` and paired statements on one line, used throughout
    "E702",   # `a.append(x); b.append(y)`, the same compact style
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and request bodies as argument defaults, so the call in
# the default is the framework's interface rather than the mutable-default bug B008 looks
# for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]
