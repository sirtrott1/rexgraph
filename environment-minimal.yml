# Core build environment. Install from the repository root after activation.
# micromamba create -p .venv -f environment-minimal.yml
# micromamba run -p .venv python -m pip install -e . --no-build-isolation
name: rexgraph
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - numpy>=2.0
  - meson>=1.3
  - meson-python>=0.18
  - cython>=3.0
  - ninja
  - pkg-config
  - c-compiler
  - openblas
