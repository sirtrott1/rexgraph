# Agent package configuration.
# make install installs Core, RCDB, RCQL, System and the standard Agent profile.
# Additional dependencies are declared as optional extras below.

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rexgraph-agent"
version = "1.3.1"
description = "Orchestration, server, frontend, and integrations for the RexGraph ecosystem"
readme = "README.md"
# SPDX, per PEP 639: "Apache License 2.0" is the name, not the identifier,
# and the table form is deprecated. Metadata 2.4 carries this as
# License Expression with the file itself bundled alongside.
license = "Apache-2.0"
# its own copy, not ../LICENSE: a path outside the project root is silently
# DROPPED rather than rejected, and the wheel then claims Apache-2.0 while
# carrying no license at all, which the license itself requires it to carry
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "RexGraph"},
]
keywords = [
    "agent", "orchestration", "auto-dispatch",
    "langchain", "huggingface", "trustgraph",
    "relational-complex", "topological-data-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core dependencies: compiled math library + tabular I/O. `agent.auto`
# (imported by `agent/__init__.py`) uses pandas for CSV/DataFrame
# auto detection, so it is required for the package to import at all.
dependencies = [
    "rexgraph>=1.3.1",
    # Not optional: agent.metrics and agent.scoring export from rcdb.analytics, and
    # agent.rcdb and its four siblings are compatibility surfaces over the package. The
    # agent does not import without it.
    "rexgraph-rcdb>=1.3.1",
    "numpy>=1.24",
    # Agent's existing pipeline and graph views use SciPy directly. Core and
    # RCDB no longer provide this dependency transitively.
    "scipy>=1.13",
    "pandas>=2.2.2",
]

[project.optional-dependencies]
# Optional molecular syntax and substructure interpretation.
molecules = [
    "rexgraph[molecules]>=1.3.1",
]

# Columnar queries and DataFrame views of stored structural signatures.
analytics = ["duckdb>=1.0", "polars>=1.0"]

# Optional numerical baselines over features read from RCDB records.
baselines = [
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost-cpu>=2.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "xgboost>=2.1; sys_platform == 'darwin'",
]

# Typed queries over live agent values. agent/agent/rcql_runtime.py binds sources and
# policies; the language itself depends on rexgraph alone and never imports the agent.
rcql = [
    "rexgraph-rcql>=1.3.1",
]

# Sealing and opening a rexgraph container. agent/agent/kms.py resolves a key
# identifier and does the AEAD; rexgraph core stays free of both.
crypto = [
    "cryptography>=42",
]

# Schema/ontology diagnosis: dialect aware SQL parsing + Mongo sampling
schema = [
    "sqlglot>=20",
]


# Cloud data warehouse dialects (Snowflake / BigQuery / Redshift / Databricks).
# The connector code is unchanged: warehouses reflect through the same
# dialect generic SQLAlchemy path as any SQL database; these only add the
# vendor drivers. Enables the warehouse schemes in `rexgraph-connect list`.
warehouse = [
    "snowflake-sqlalchemy>=1.5",
    "sqlalchemy-bigquery>=1.9",
    "sqlalchemy-redshift>=0.8",
    "databricks-sqlalchemy>=1.0",
]


# Live connector drivers beyond SQL (which [server] already covers via
# sqlalchemy): document, property graph, and stream sources. The in memory /
# structure paths need none of these: they are only for live reflection.
connectors = [
    "pymongo>=4.6",
    "neo4j>=5.0",
]


# Object storage backend for the RCDB (agent/agent/objectstore.py). fsspec IS the
# backend: one wire protocol for every provider: and on its own it enables the
# memory:// and file:// schemes, which is what the local paths and the test suite
# exercise. Cloud providers add only their driver, the same shape as [warehouse].
objectstore = [
    "fsspec>=2024.2",
]

objectstore-cloud = [
    "rexgraph-agent[objectstore]",
    "s3fs>=2024.2",
    "gcsfs>=2024.2",
    "adlfs>=2024.2",
]


# Web UI + API server (the default for most users)
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "bcrypt>=4.0",
    "limits>=3.0",
    "sqlalchemy>=2.0",
]

# PDF/image OCR: CPU backends (tesseract + pymupdf)
# Enables: tesseract (offline) + Unlimited OCR client (GPU server)
# Priority: GPU server → PaddleOCR → Mistral → GOT OCR → tesseract
# Set REXGRAPH_OCR_PRIORITY=tesseract,paddleocr,server to override
ocr = [
    "requests>=2.28",
    "pymupdf>=1.22",
    "pytesseract>=0.3.10",
]

# PaddleOCR: local OCR (install paddle separately for your platform)
#   CPU:  pip install paddlepaddle paddleocr
#   CUDA: pip install paddlepaddle gpu paddleocr
#   ROCm: not supported: use Unlimited OCR with DeepSeek instead
ocr-paddle = [
    "paddleocr>=2.7",
]

# GOT-OCR2.0: HuggingFace transformer OCR (needs GPU + torch)
ocr-got = [
    "transformers>=4.36",
    "torch>=2.0",
    "accelerate>=0.26",
]

# Training data export (safetensors for PyTorch/JAX/HuggingFace)
training = [
    "safetensors>=0.3",
]

# LoRA fine tuning of a Hugging Face model (the finetune phase and its optimizer A/B).
# Heavy: pulls torch, transformers, peft, datasets.
finetune = [
    "transformers>=4.44",
    "peft>=0.11",
    "datasets>=2.0",
    "accelerate>=0.30",
    "safetensors>=0.3",
    "pillow>=9.0",       # image benchmarks (mnist/cifar) decode via datasets → PIL
]

# YAML agent configs
yaml = [
    "pyyaml>=5.1",
]

# LangChain structural tools
langchain = [
    "langchain>=0.1",
    "langchain-core>=0.1",
]

# LangGraph execution tracking
langgraph = [
    "langgraph>=0.0.40",
]

# HuggingFace model analysis
huggingface = [
    "transformers>=4.36",
    "torch>=2.0",
    "sentencepiece>=0.1.99",
]

# vLLM GPU model serving
vllm = [
    "vllm>=0.3",
]

# TrustGraph knowledge graph integration
trustgraph = [
    "trustgraph-base>=2.4",
    "pyarrow>=16.0",
    "aiohttp>=3.9",
]

# Mistral cloud OCR API
mistral = [
    "mistralai>=1.0",
]

# OIDC/SSO enterprise auth
oidc = [
    "python-jose[cryptography]>=3.3",
]

# Development and testing. Pulls in [server] because the test suite imports
# the FastAPI server/routes, and [objectstore] because tests/test_store_interop.py
# exercises the object store over memory://, so `pip install ./agent[dev]` is
# self sufficient for running `pytest`.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "httpx>=0.27",
    # Starlette 1.3 moved TestClient onto httpx2 and warns when it falls back to httpx.
    # Tests only: the server runtime still uses httpx and must not gain this.
    "httpx2>=2.0.0",
    "rexgraph-agent[server,objectstore,crypto]",
]

# Profiles: named bundles for common deployments. Compose the granular extras
# above so users pick one instead of listing pieces. See the README install
# table for what each is for.

# Full local deployment: web UI, schema tools, live connectors, OCR, training
# export, YAML configs. No torch and no cloud warehouse drivers, so it stays
# CPU light. The recommended everyday install.
standard = [
    "rexgraph-agent[server,schema,connectors,ocr,training,yaml]",
]

# The torch ML stack: LoRA fine tuning, HuggingFace model analysis, training
# export. Heavy: pulls torch, transformers, peft, datasets.
ml = [
    "rexgraph[nn]>=1.3.1",
    "rexgraph-agent[training,finetune,huggingface]",
]

# Orchestration framework integrations.
integrations = [
    "rexgraph-agent[langchain,langgraph,trustgraph]",
]

# Everything that runs on CPU: standard + integrations + warehouse drivers +
# the torch ML stack + cloud OCR + SSO. Large; prefer a narrower profile unless
# you need all of it. Excludes GPU only extras (vllm, ocr got, cuda).
all = [
    "rexgraph-agent[standard,integrations,warehouse,objectstore-cloud,ml,molecules,analytics,baselines,ocr-paddle,mistral,oidc]",
]

# Dependencies for the optional CPU feature tests. GPU runtimes and external
# datasets remain separate requirements reported by the test runner.
test-full = [
    "rexgraph-agent[standard,dev,ml,molecules,analytics,baselines,langchain,langgraph]",
    "rexgraph[dev,tf]>=1.3.1",
]

[project.scripts]
rexgraph-ui = "agent.server.app:main"          # the web UI / app server (the obvious start command)
rexgraph-ocr = "agent.cli.ocr:ocr_main"
rexgraph-test = "agent.cli.test_all:main"
rexgraph-run = "agent.cli.run_pipeline:main"
rexgraph-deploy = "agent.cli.deploy:main"
rexgraph-auth = "agent.cli.auth:main"
rexgraph-serve = "agent.cli.serve:main"
rexgraph-setup = "agent.cli.setup:main"
rexgraph-config = "agent.cli.config:main"
rexgraph-connect = "agent.cli.connect:main"
rexgraph-local = "agent.local_runtime:main"
rexgraph-hive = "agent.hive:main"
rexgraph-courier = "agent.courier:main"       # carry stored complexes between stores or to a peer
rexgraph-bee = "agent.external_bee:main"      # an endpoint answered by a process that polls it
rexgraph-models = "agent.models.cli:main"
rexgraph-ops = "agent.lifecycle:main"
rcf-server = "agent.server.app:main"

[project.urls]
Repository = "https://github.com/sirtrott1/rexgraph"
Documentation = "https://github.com/sirtrott1/rexgraph/tree/main/agent"

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["tests*"]

# Frontend static files
[tool.setuptools.package-data]
"agent" = [
    "frontend/*.html",
    "frontend/*.jsx",
    "frontend/styles/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
